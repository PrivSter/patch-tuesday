name: tests
on:
  push:
  pull_request:
  # Pre-flight: catch a broken main before the collection days (8th-21st).
  schedule:
    - cron: "30 6 1,7 * *"   # 06:30 UTC on the 1st and 7th
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest -q
